[build]
  command = "npm run build:site"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/play/terrain/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
